hikari:
    minimum-idle: 5                # 最小空闲连接数(一般设成5,保证连接池里随时可用)
    maximum-pool-size: 15          # 最大连接数(并发不大时 10~20 就够了)
    idle-timeout: 600000           # 空闲超时时间(10分钟)
    max-lifetime: 1800000          # 最大存活时间(30分钟,建议略小于MySQL的wait_timeout)
    connection-timeout: 30000      # 获取连接的最大等待时间(30秒)
    validation-timeout: 5000       # 校验连接是否可用的超时时间(5秒)
    keepalive-time: 300000         # 保活间隔(5分钟,防止连接被MySQL超时断开)
