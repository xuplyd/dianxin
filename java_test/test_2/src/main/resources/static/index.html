<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>需求提交</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.3);
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #4A90E2, #357ABD);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: linear-gradient(90deg, #357ABD, #2B5F9D);
        }

        button:active {
            transform: scale(0.98);
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>需求提交</h2>
        <form id="reqForm">
            <div class="form-group">
                <label>所在部门</label>
                <select name="department" id="departmentSelect" required>
                    <option value="" disabled selected>加载中...</option>
                </select>
            </div>
            <div class="form-group">
                <label>申请部门</label>
                <select name="applyDepartment" id="departmentSelect2" required>
                    <option value="" disabled selected>加载中...</option>
                </select>
            </div>
            <div class="form-group">
                <label>客户名称</label>
                <input name="customerName" required>
            </div>
            <div class="form-group">
                <label>商机编码</label>
                <input name="businessCode" required>
            </div>
            <div class="form-group">
                <label>需求名称</label>
                <input name="requirementName" required>
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea name="description" required></textarea>
            </div>
            <div class="form-group">
                <label>预计支撑时间</label>
                <input type="datetime-local" name="expectedSupportTime" required>
            </div>
            <div class="form-group">
                <label>联系人</label>
                <input name="contactName" required>
            </div>
            <div class="form-group">
                <label>电话</label>
                <input name="contactPhone" required pattern="^1\d{10}$" title="请输入有效的11位手机号"
                    placeholder="例:13800000000">
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea name="remark"></textarea>
            </div>
            <button type="submit">提交</button>
        </form>
    </div>

    <script>
        // 动态加载所在部门
        async function loadDepartments() {
            try {
                let res = await fetch("/api/departments");
                let list = await res.json();
                let select = document.getElementById("departmentSelect");
                select.innerHTML = '<option value="" disabled selected>请选择所在部门</option>';
                list.forEach(d => {
                    let option = document.createElement("option");
                    option.value = d;
                    option.textContent = d;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error("部门加载失败", err);
            }
        }

        // 动态加载申请部门
        async function loadDepartments2() {
            try {
                let res = await fetch("/api/applyDepartment");
                let list = await res.json();
                let select = document.getElementById("departmentSelect2");
                select.innerHTML = '<option value="" disabled selected>请选择申请部门</option>';
                list.forEach(d => {
                    let option = document.createElement("option");
                    option.value = d;
                    option.textContent = d;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error("部门加载失败", err);
            }
        }

        // 表单提交
        document.getElementById("reqForm").onsubmit = async (e) => {
            e.preventDefault();
            let form = new FormData(e.target);
            let data = Object.fromEntries(form.entries());

            // JS 校验手机号
            const phoneRegex = /^1\d{10}$/;
            if (!phoneRegex.test(data.contactPhone)) {
                alert("请输入有效的11位手机号");
                return;
            }

            // 将 expectedSupportTime 转换为带时区的 ISO 8601 格式
            if (data.expectedSupportTime) {
                const date = new Date(data.expectedSupportTime);
                data.expectedSupportTime = date.toISOString(); // 转换为 2025-09-02T11:24:00.000Z
            }

            await fetch("/api/submit", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            alert("提交成功！");
            e.target.reset();
        }

        // 页面加载时调用
        loadDepartments();
        loadDepartments2();
    </script>
</body>

</html>
