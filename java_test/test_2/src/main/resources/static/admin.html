<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>需求记录</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #e0f0ff, #f9f9f9);
    margin: 0;
    padding: 30px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
}

.table-container {
    background: #fff;
    padding: 30px 25px;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    width: 100%;
    max-width: 1800px;
    overflow-x: auto;
    animation: fadeIn 0.6s ease-in-out;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
    font-size: 26px;
}

.filter {
    display: flex;
    flex-wrap: wrap;
    gap: 15px 20px;
    margin-bottom: 15px;
    align-items: center;
}

.filter label {
    font-size: 14px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 6px;
}

.filter input,
.filter select {
    padding: 7px 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    min-width: 140px;
    transition: all 0.3s;
}

.filter input:focus,
.filter select:focus {
    border-color: #4a90e2;
    box-shadow: 0 0 6px rgba(74, 144, 226, 0.3);
}

.filter button {
    padding: 8px 20px;
    background: linear-gradient(90deg, #4a90e2, #357abd);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 5px;
}

.filter button:hover {
    background: linear-gradient(90deg, #357abd, #2b5f9d);
    transform: translateY(-1px);
}

.filter button:active {
    transform: scale(0.97);
}

.quick-search {
    width: 100%;
    padding: 8px 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
}

table {
    border-collapse: collapse;
    width: max-content;
    min-width: 1000px;
}

th, td {
    padding: 12px 15px;
    text-align: center;
    font-size: 14px;
    white-space: nowrap;
    border: 1px solid #eee;
}

/* 固定表头 */
th {
    position: sticky;
    top: 0;
    background: #4a90e2;
    color: #fff;
    font-weight: 600;
    z-index: 5;
}

/* 固定前两列 */
th:first-child, td:first-child,
th:nth-child(2), td:nth-child(2) {
    position: sticky;
    left: 0;
    background: #4a90e2;
    color: white;
    z-index: 4;
}
th:nth-child(2), td:nth-child(2) {
    left: 80px;
}

tr:nth-child(even) { background: #f9f9f9; }
tr:hover { background: #eaf3ff; cursor: pointer; transition: background 0.2s; }

.pagination {
    margin-top: 25px;
    text-align: center;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}

.pagination button {
    min-width: 36px;
    padding: 6px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
}

.pagination button:hover {
    background: #f1f7ff;
    border-color: #4a90e2;
}

.pagination .active-page {
    background: #4a90e2;
    color: #fff;
    border-color: #4a90e2;
    font-weight: bold;
    transform: scale(1.05);
}

@media (max-width: 900px) {
    .filter { flex-direction: column; align-items: flex-start; }
    table { min-width: 600px; font-size: 12px; }
}

@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="table-container">
    <h2>需求记录</h2>

    <div class="filter">
        <label>创建时间：
            <input type="date" id="startTime"> -
            <input type="date" id="endTime">
        </label>
        <label>所在部门
            <select id="department" required>
                <option value="" disabled selected>加载中...</option>
            </select>
        </label>
        <label>申请部门
            <select id="applyDepartment" required>
                <option value="" disabled selected>加载中...</option>
            </select>
        </label>
        <label>预计支撑时间：
            <input type="date" id="expectedTime">
        </label>
        <button onclick="search()">🔍 查询</button>
        <button onclick="exportExcel()">📥 导出 Excel</button>
    </div>

    <input type="text" id="quickSearch" class="quick-search" placeholder="快速搜索客户/需求名称/联系人">

    <table id="records">
        <thead>
        <tr>
            <th style="width:80px;">审批编号</th>
            <th style="width:120px;">所在部门</th>
            <th style="width:120px;">申请部门</th>
            <th style="width:150px;">客户</th>
            <th style="width:200px;">需求名称</th>
            <th style="width:120px;">联系人</th>
            <th style="width:120px;">电话</th>
            <th style="width:160px;">提交时间</th>
            <th style="width:160px;">预计支撑时间</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
</div>

<script>
async function loadDepartments() {
    try {
        let res = await fetch("/api/departments");
        let list = await res.json();
        let select = document.getElementById("department");
        select.innerHTML = '<option value="" disabled selected>请选择所在部门</option>';
        list.forEach(d => { let o=document.createElement("option"); o.value=d; o.textContent=d; select.appendChild(o); });
    } catch(err){console.error("部门加载失败", err);}
}

async function loadApplyDepartments() {
    try {
        let res = await fetch("/api/applyDepartment");
        let list = await res.json();
        let select = document.getElementById("applyDepartment");
        select.innerHTML = '<option value="" disabled selected>请选择申请部门</option>';
        list.forEach(d => { let o=document.createElement("option"); o.value=d; o.textContent=d; select.appendChild(o); });
    } catch(err){console.error("申请部门加载失败", err);}
}

let page=0, size=10, totalPages=1, currentData=[];

function getFilters() {
    return {
        startTime: document.getElementById("startTime").value,
        endTime: document.getElementById("endTime").value,
        department: document.getElementById("department").value,
        applyDepartment: document.getElementById("applyDepartment").value,
        expectedTime: document.getElementById("expectedTime").value
    };
}

async function loadRecords(p=0){
    page=p;
    const filters=getFilters();
    const params=new URLSearchParams({page,size,...filters});
    try{
        let res=await fetch(`/api/records?`+params.toString());
        let data=await res.json();
        totalPages=data.totalPages;
        currentData=data.content;
        renderTable(currentData);
        renderPagination();
    }catch(err){console.error("加载记录失败", err);}
}

function renderTable(data){
    let tbody=document.querySelector("#records tbody");
    tbody.innerHTML="";
    data.forEach(r=>{
        let row=document.createElement("tr");
        row.innerHTML=`
            <td>${r.id}</td>
            <td>${r.department}</td>
            <td>${r.applyDepartment}</td>
            <td>${r.customerName}</td>
            <td>${r.requirementName}</td>
            <td>${r.contactName}</td>
            <td>${r.contactPhone}</td>
            <td>${r.submitTime?r.submitTime.replace("T"," "):""}</td>
            <td>${r.expectedSupportTime?r.expectedSupportTime.replace("T"," "):""}</td>
        `;
        row.onclick=()=>window.location.href=`detail.html?id=${r.id}`;
        tbody.appendChild(row);
    });
}

function renderPagination(){
    let pagination=document.getElementById("pagination");
    pagination.innerHTML="";
    for(let i=0;i<totalPages;i++){
        let btn=document.createElement("button");
        btn.textContent=i+1;
        if(i===page) btn.classList.add("active-page");
        btn.onclick=()=>loadRecords(i);
        pagination.appendChild(btn);
    }
}

function search(){ loadRecords(0); }

document.getElementById("quickSearch").addEventListener("input", function(){
    let keyword=this.value.trim().toLowerCase();
    let filtered=currentData.filter(r=>
        r.customerName.toLowerCase().includes(keyword)||
        r.requirementName.toLowerCase().includes(keyword)||
        r.contactName.toLowerCase().includes(keyword)
    );
    renderTable(filtered);
});

function exportExcel(){
    if(!currentData.length) return alert("无数据导出");
    let csv="审批编号,所在部门,申请部门,客户,需求名称,联系人,电话,提交时间,预计支撑时间\n";
    currentData.forEach(r=>{
        csv+=[r.id,r.department,r.applyDepartment,r.customerName,r.requirementName,
            r.contactName,r.contactPhone,
            r.submitTime?r.submitTime.replace("T"," "):"",
            r.expectedSupportTime?r.expectedSupportTime.replace("T"," "):""].join(",")+"\n";
    });
    let blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    let link=document.createElement("a");
    link.href=URL.createObjectURL(blob);
    link.download="需求记录.csv";
    link.click();
}

// 初始化
loadDepartments();
loadApplyDepartments();
loadRecords();
</script>
</body>
</html>
